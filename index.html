<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ansh Kumar - Home</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- AOS Library for Scroll Animations -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      line-height: 1.6;
    }

    nav {
      background: #111;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
      z-index: 1000;
    }

    nav a {
      color: #00bfff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover {
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 60px 20px;
    }

    .profile-pic {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00bfff;
      margin-bottom: 20px;
      box-shadow: 0 0 20px #00bfff66;
    }

    .typing {
      font-size: 2.2rem;
      color: #00bfff;
      font-family: 'Orbitron', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #00bfff;
      width: 0;
      margin: auto;
      animation: typing 2.5s steps(20) forwards, blink 0.7s infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 260px; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .tagline {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #ccc;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    @media (max-width: 600px) {
      .typing {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="education.html">Education</a>
    <a href="skills.html">Skills</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Main Content -->
  <div class="container" data-aos="fade-in">
    <img src="profile.jpg" alt="Ansh Kumar" class="profile-pic" data-aos="zoom-in" />
    <div class="typing">Ansh Kumar</div>
    <div class="tagline" data-aos="fade-up">Aspiring Engineer • Tech Enthusiast • Arduino Project Builder</div>
  </div>

  <footer>
    © 2025 Ansh Kumar | Resume Website by Nikhil
  </footer>

  <!-- AOS Scripts -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 1000 });</script>

</body>
</html>
